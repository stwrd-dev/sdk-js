name: Publish

# Publishes the packages to npm when a `v<version>` tag is pushed (for example
# `v0.1.1`). Every package is published with a verifiable provenance statement.
#
# Authentication. CI never uses an npm token: the job authenticates to npm
# through OpenID Connect (trusted publishing), so no npm token is stored
# anywhere. Configure it on npmjs.com, for each of the four packages (Settings,
# Trusted Publisher): GitHub Actions, organization `stwrd-dev`, repository
# `sdk-js`, workflow filename `publish.yml`.
#
# A package must already exist on npm before a trusted publisher can be
# configured, so the first release of the `@stwrd/*` names (0.1.1) is published
# manually from the owner's machine with 2FA. After that, trusted publishers
# are configured and every later release comes from this workflow.
#
# The four packages share one version. The tag must match it, and the packages
# are published in dependency order: `core` first, because `node` and
# `workers` depend on it. A package whose version is already on npm is skipped,
# so a failed run can be re-run safely.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stwrd
          POSTGRES_PASSWORD: stwrd
          POSTGRES_DB: stwrd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stwrd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STWRD_TEST_DB_URL: postgresql://stwrd:stwrd@localhost:5432/stwrd_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Check that the tag matches the package versions
        run: node scripts/check-versions.mjs "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag_args=()
          # A pre-release version must not become the `latest` dist-tag.
          case "$version" in
            *-*) tag_args=(--tag next) ;;
          esac
          echo "publishing with npm trusted publishing (OpenID Connect)"
          for dir in core node react workers; do
            name="$(node -p "require('./packages/${dir}/package.json').name")"
            if output="$(npm view "${name}@${version}" version 2>&1)"; then
              echo "${name}@${version} is already published; skipping."
              continue
            fi
            if ! grep -q "E404" <<<"$output"; then
              echo "::error::could not look up ${name}@${version}: ${output}"
              exit 1
            fi
            npm publish --workspace "packages/${dir}" --provenance --access public "${tag_args[@]}"
          done
