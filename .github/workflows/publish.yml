name: Publish

# Publishes the packages to npm when a `v<version>` tag is pushed (for example
# `v0.1.0`). Every package is published with a verifiable provenance statement.
#
# Authentication. The normal path is npm trusted publishing: the job
# authenticates to npm through OpenID Connect, so no npm token is stored
# anywhere. Configure it on npmjs.com, for each of the four packages (Settings,
# Trusted Publisher): GitHub Actions, organization `stwrd-dev`, repository
# `sdk-js`, workflow filename `publish.yml`.
#
# A package must already exist on npm before a trusted publisher can be
# configured, so the very first release cannot use it. For that release only,
# the job falls back to a granular npm access token stored as the repository
# secret `NPM_TOKEN` (Settings, Secrets and variables, Actions). The token needs
# read and write permission on the `@stwrd-auth` packages. `NPM_TOKEN` is
# temporary: once the trusted publisher of every package is configured, delete
# the secret (and revoke the token on npmjs.com). With no `NPM_TOKEN` secret
# the job uses OpenID Connect, so later releases need no change to this file.
#
# The four packages share one version. The tag must match it, and the packages
# are published in dependency order: `core` first, because `node` and
# `workers` depend on it. A package whose version is already on npm is skipped,
# so a failed run can be re-run safely.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stwrd
          POSTGRES_PASSWORD: stwrd
          POSTGRES_DB: stwrd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stwrd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STWRD_TEST_DB_URL: postgresql://stwrd:stwrd@localhost:5432/stwrd_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Check that the tag matches the package versions
        run: node scripts/check-versions.mjs "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `NPM_TOKEN` is only ever read from the secret store into this step's
      # environment (GitHub masks secret values in the log). It is never
      # written to a file by this script or printed.
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag_args=()
          # A pre-release version must not become the `latest` dist-tag.
          case "$version" in
            *-*) tag_args=(--tag next) ;;
          esac
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "publishing with the NPM_TOKEN secret (first release)"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "publishing with npm trusted publishing (OpenID Connect)"
          fi
          unset NPM_TOKEN
          for dir in core node react workers; do
            name="$(node -p "require('./packages/${dir}/package.json').name")"
            if output="$(npm view "${name}@${version}" version 2>&1)"; then
              echo "${name}@${version} is already published; skipping."
              continue
            fi
            if ! grep -q "E404" <<<"$output"; then
              echo "::error::could not look up ${name}@${version}: ${output}"
              exit 1
            fi
            npm publish --workspace "packages/${dir}" --provenance --access public "${tag_args[@]}"
          done
